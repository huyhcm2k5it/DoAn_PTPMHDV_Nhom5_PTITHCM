name: Huy services and Catalog contract
on:
  push:
    paths: ['services/catalog/**', 'services/clinical/**', 'services/diagnostic/**', 'contracts/http/catalog*', 'tools/huy/**', 'tools/catalog-preview/**', 'apps/web/src/features/catalog/**', '.github/workflows/huy-go.yml']
  pull_request:
    paths: ['services/catalog/**', 'services/clinical/**', 'services/diagnostic/**', 'contracts/http/catalog*', 'tools/huy/**', 'tools/catalog-preview/**', 'apps/web/src/features/catalog/**', '.github/workflows/huy-go.yml']
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog, clinical, diagnostic]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
      - name: Hexagonal dependency direction
        working-directory: .
        run: python3 tools/huy/check_architecture.py
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
          POSTGRES_DB: umc_huy_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d umc_huy_test_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache-dependency-path: services/catalog/go.sum
      - name: Real PostgreSQL tests (not skipped)
        working-directory: services/catalog
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-not-a-production-secret@127.0.0.1:5432/umc_huy_test_ci?sslmode=disable
          CONTRACT_RESPONSE_FILE: ${{ runner.temp }}/catalog-http-responses.json
        run: go test -race -count=1 -tags=integration -v ./internal/adapters/outbound/postgres
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate actual HTTP responses against the contract
        run: |
          pip install -r tools/huy/contract-requirements.txt
          python tools/huy/check_catalog_contract.py "${{ runner.temp }}/catalog-http-responses.json"
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/huy/contract-requirements.txt
      - run: python tools/huy/check_catalog_contract.py
      - name: Generated contract stays reproducible
        run: |
          python tools/huy/generate_catalog_contract.py
          git diff --exit-code -- contracts/http/catalog.openapi.json
  catalog-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/catalog-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: tools/catalog-preview/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
