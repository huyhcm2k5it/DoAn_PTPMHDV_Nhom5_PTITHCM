name: Quan Node Mongo Web

on:
  push:
    paths:
      - 'services/appointment/**'
      - 'services/patient/**'
      - 'tests/mongo/**'
      - 'apps/web/**'
      - 'contracts/**'
      - 'rabbitmq/**'
      - 'envoy/**'
      - 'infra/compose/**'
      - '.github/workflows/quan-node.yml'
  pull_request:
    paths:
      - 'services/appointment/**'
      - 'services/patient/**'
      - 'tests/mongo/**'
      - 'apps/web/**'
      - 'contracts/**'
      - 'rabbitmq/**'
      - 'envoy/**'
      - 'infra/compose/**'
      - '.github/workflows/quan-node.yml'

permissions:
  contents: read

jobs:
  node-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [appointment, patient]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  mongo-contracts:
    # mongodb-memory-server downloads a MongoDB 8.0.16 Ubuntu 24.04 binary.
    # Keep this runner pinned because ubuntu-latest moved to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests/mongo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: tests/mongo/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Parse JSON contracts and topology
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const paths = [
            'contracts/http/appointment.openapi.json',
            'contracts/messages/appointment-booking.v1.schema.json',
            'contracts/messages/clinical-queue.v1.schema.json',
            'rabbitmq/definitions.json',
          ];
          for (const path of paths) JSON.parse(fs.readFileSync(path, 'utf8'));
          console.log(`validated ${paths.length} JSON documents`);
          NODE
