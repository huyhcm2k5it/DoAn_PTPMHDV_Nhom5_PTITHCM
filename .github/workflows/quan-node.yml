name: Quan Node Mongo Web

on:
  push:
    paths:
      - 'services/appointment/**'
      - 'services/patient/**'
      - 'services/pharmacy/**'
      - 'mongo/**'
      - 'scripts/dev/**'
      - 'tools/quan/**'
      - 'tests/mongo/**'
      - 'apps/web/**'
      - 'contracts/**'
      - 'rabbitmq/**'
      - 'envoy/**'
      - 'infra/compose/**'
      - '.github/workflows/quan-node.yml'
  pull_request:
    paths:
      - 'services/appointment/**'
      - 'services/patient/**'
      - 'services/pharmacy/**'
      - 'mongo/**'
      - 'scripts/dev/**'
      - 'tools/quan/**'
      - 'tests/mongo/**'
      - 'apps/web/**'
      - 'contracts/**'
      - 'rabbitmq/**'
      - 'envoy/**'
      - 'infra/compose/**'
      - '.github/workflows/quan-node.yml'

permissions:
  contents: read

jobs:
  node-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [appointment, patient, pharmacy]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  mongo-contracts:
    # mongodb-memory-server downloads a MongoDB 8.0.16 Ubuntu 24.04 binary.
    # Keep this runner pinned because ubuntu-latest moved to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests/mongo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: tests/mongo/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Install patient service dependencies used by Mongo tests
        working-directory: services/patient
        run: npm ci --ignore-scripts
      - name: Install appointment service dependencies used by Mongo tests
        working-directory: services/appointment
        run: npm ci --ignore-scripts
      - name: Install pharmacy service dependencies used by Mongo tests
        working-directory: services/pharmacy
        run: npm ci --ignore-scripts
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1
      - run: npm run build

  pharmacy-broker:
    runs-on: ubuntu-24.04
    services:
      rabbitmq:
        image: rabbitmq:4.3.6-management
        env:
          RABBITMQ_DEFAULT_USER: quan-ci
          RABBITMQ_DEFAULT_PASS: isolated-test-only
          RABBITMQ_DEFAULT_VHOST: quan-ci-pharmacy
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Install isolated broker test dependencies
        run: |
          npm ci --ignore-scripts --prefix tests/mongo
          npm ci --ignore-scripts --prefix services/pharmacy
      - name: Real RabbitMQ producer receiver and restart tests
        working-directory: tests/mongo
        env:
          TEST_AMQP_URL: amqp://quan-ci:isolated-test-only@127.0.0.1:5672/quan-ci-pharmacy
        run: node --test pharmacy-broker.integration.js

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Parse JSON contracts and topology
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const paths = [
            'contracts/http/appointment.openapi.json',
            'contracts/messages/appointment-booking.v1.schema.json',
            'contracts/messages/clinical-queue.v1.schema.json',
            'rabbitmq/definitions.json',
          ];
          for (const path of paths) JSON.parse(fs.readFileSync(path, 'utf8'));
          console.log(`validated ${paths.length} JSON documents`);
          NODE
      - name: Reproduce Pharmacy OpenAPI contract
        run: node tools/quan/generate-pharmacy-contract.js --check
      - name: Validate Pharmacy quorum receiver bindings
        run: node tools/quan/check-pharmacy-topology.js
      - name: Validate Compose structure without resolving local secrets
        run: docker compose -f infra/compose/compose.yaml config --no-env-resolution --no-interpolate --quiet
