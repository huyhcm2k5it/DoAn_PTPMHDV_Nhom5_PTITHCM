static_resources:
  listeners:
  - name: ingress_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          route_config:
            name: local_route
            virtual_hosts:
            - name: umc_care_backend
              domains:
              - '*'
              cors:
                allow_origin_string_match:
                - exact: http://localhost:5173
                - exact: http://127.0.0.1:5173
                - exact: http://localhost:8080
                - exact: http://127.0.0.1:8080
                allow_methods: GET, PUT, POST, PATCH, DELETE, OPTIONS
                allow_headers: DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Idempotency-Key,X-Correlation-Id,X-Authorization-Lease
                expose_headers: Location,Content-Length,Content-Range,X-Correlation-Id
                max_age: '1728000'
              routes:
              - name: IA-001
                match: &id001
                  path: /api/v1/auth/register
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                route:
                  cluster: identity_service
                  timeout: 15s
              - name: IA-002
                match: &id002
                  path: /api/v1/auth/otp/verify
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                route:
                  cluster: identity_service
                  timeout: 15s
              - name: IA-003
                match: &id003
                  path: /api/v1/auth/otp/resend
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                route:
                  cluster: identity_service
                  timeout: 15s
              - name: IA-004
                match: &id004
                  path: /api/v1/auth/login
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                route:
                  cluster: identity_service
                  timeout: 15s
              - name: IA-005
                match:
                  path: /api/v1/auth/refresh
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                route:
                  cluster: identity_service
                  timeout: 15s
              - name: IA-006
                match:
                  path: /api/v1/auth/logout
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                route:
                  cluster: identity_service
                  timeout: 15s
              - name: IA-007
