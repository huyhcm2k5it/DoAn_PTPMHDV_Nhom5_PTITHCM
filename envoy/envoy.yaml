          http_filters:
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: gateway_rate
              token_bucket:
                max_tokens: 100
                tokens_per_fill: 100
                fill_interval: 1s
              filter_enabled:
                runtime_key: gateway_rate_enabled
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              filter_enforced:
                runtime_key: gateway_rate_enforced
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              response_headers_to_add:
              - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                header:
                  key: retry-after
                  value: '1'
          - name: envoy.filters.http.jwt_authn
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                umc_identity:
                  issuer: umc-care-identity
                  audiences:
                  - umc-care-services
                  forward: true
                  from_headers:
                  - name: Authorization
                    value_prefix: 'Bearer '
                  local_jwks:
                    filename: /etc/envoy/jwks.json
              rules:
              - match:
                  path: /api/v1/auth/refresh
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                requires:
                  allow_missing: {}
              - match: *id001
                requires:
                  allow_missing: {}
              - match: *id002
                requires:
                  allow_missing: {}
              - match: *id003
                requires:
                  allow_missing: {}
              - match: *id004
                requires:
                  allow_missing: {}
              - match: *id005
                requires:
                  allow_missing: {}
              - match: *id006
                requires:
                  allow_missing: {}
              - match: *id007
                requires:
                  allow_missing: {}
              - match: *id008
                requires:
                  allow_missing: {}
              - match: *id009
                requires:
                  allow_missing: {}
              - match: *id010
                requires:
                  allow_missing: {}
              - match:
                  prefix: /
                requires:
                  provider_name: umc_identity
          - name: envoy.filters.http.cors
