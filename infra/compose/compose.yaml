# Shared application stack. Infrastructure URLs come from the three owner env files.
name: umc-care-local
services:
  patient:
    build:
      context: ../../services/patient
      dockerfile: Dockerfile
      additional_contexts:
        mongo_shared: ../../mongo
    environment:
      NODE_ENV: production
      PORT: ${PATIENT_PORT:?set PATIENT_PORT}
      MONGODB_URI: $PATIENT_MONGO_URI
      JWT_PUBLIC_KEY_FILE: /run/config/jwt_public.pem
      JWT_ISSUER: umc-care-identity
      JWT_AUDIENCE: umc-care-services
    volumes:
    - ../../infra/certs/jwt_public.pem:/run/config/jwt_public.pem:ro
    networks:
    - private
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:' + process.env.PORT + '/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
  appointment:
    build:
      context: ../../services/appointment
      dockerfile: Dockerfile
      additional_contexts:
        mongo_shared: ../../mongo
    environment:
      NODE_ENV: production
      PORT: ${APPOINTMENT_PORT:?set APPOINTMENT_PORT}
      MONGODB_URI: $APPOINTMENT_MONGO_URI
      JWT_PUBLIC_KEY_FILE: /run/config/jwt_public.pem
      JWT_ISSUER: umc-care-identity
      JWT_AUDIENCE: umc-care-services
      APPOINTMENT_REDIS_URL: ${UMC_REDIS_URL:?set shared online Redis URL from Quân}
    volumes:
    - ../../infra/certs/jwt_public.pem:/run/config/jwt_public.pem:ro
    networks:
    - private
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:' + process.env.PORT + '/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
  appointment-worker:
    build:
      context: ../../services/appointment
      dockerfile: Dockerfile
      additional_contexts:
        mongo_shared: ../../mongo
    command:
    - npm
    - run
    - worker
    environment:
      NODE_ENV: production
      MONGODB_URI: $APPOINTMENT_MONGO_URI
      AMQP_URL: ${UMC_AMQP_URL:?set shared online AMQP URL from Quân}
    depends_on:
      appointment:
        condition: service_healthy
    networks:
    - private
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
  patient-worker:
    build:
      context: ../../services/patient
      dockerfile: Dockerfile
      additional_contexts:
        mongo_shared: ../../mongo
    command:
    - npm
    - run
    - worker
    environment:
      NODE_ENV: production
      MONGODB_URI: $PATIENT_MONGO_URI
      AMQP_URL: ${UMC_AMQP_URL:?set shared online AMQP URL from Quân}
    depends_on:
      patient:
        condition: service_healthy
    networks:
    - private
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
  pharmacy:
    build:
      context: ../../services/pharmacy
      dockerfile: Dockerfile
      additional_contexts:
        mongo_shared: ../../mongo
    environment:
      NODE_ENV: production
      PORT: ${PHARMACY_PORT:?set PHARMACY_PORT}
      MONGODB_URI: $PHARMACY_MONGO_URI
      JWT_PUBLIC_KEY_FILE: /run/config/jwt_public.pem
      JWT_ISSUER: umc-care-identity
      JWT_AUDIENCE: umc-care-services
    volumes:
    - ../../infra/certs/jwt_public.pem:/run/config/jwt_public.pem:ro
    networks:
    - private
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:' + process.env.PORT + '/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
  identity:
    build: &id001
      context: ../../services/identity
      dockerfile: Dockerfile
    env_file:
    - ../../env/hung.env
    networks:
    - private
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8004/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    environment: &id002
      PORT: ${IDENTITY_PORT:?set IDENTITY_PORT}
      JWT_PUBLIC_KEY_PATH: /run/config/jwt_public.pem
      RABBITMQ_HOST: ${RABBITMQ_HOST:?set online RabbitMQ host from Quân}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?set online RabbitMQ TLS port from Quân}
      RABBITMQ_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:?set online RabbitMQ vhost from Quân}
      UMC_AMQP_URL: ${UMC_AMQP_URL:?set shared AMQP URL from Quân}
      JWT_PRIVATE_KEY_PATH: /run/secrets/identity_private.pem
    volumes: &id003
    - ../../infra/certs/jwt_public.pem:/run/config/jwt_public.pem:ro
    - ../../services/identity/jwt_private.pem:/run/secrets/identity_private.pem:ro
    init: true
    stop_grace_period: 20s
  billing:
    build:
      context: ../../services/billing
      dockerfile: Dockerfile
    env_file:
    - ../../env/hung.env
    networks:
    - private
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8005/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    environment:
      PORT: ${BILLING_PORT:?set BILLING_PORT}
      JWT_PUBLIC_KEY_PATH: /run/config/jwt_public.pem
      RABBITMQ_HOST: ${RABBITMQ_HOST:?set online RabbitMQ host from Quân}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?set online RabbitMQ TLS port from Quân}
      RABBITMQ_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:?set online RabbitMQ vhost from Quân}
      UMC_AMQP_URL: ${UMC_AMQP_URL:?set shared AMQP URL from Quân}
    volumes:
    - ../../infra/certs/jwt_public.pem:/run/config/jwt_public.pem:ro
    init: true
    stop_grace_period: 20s
  billing-worker:
    build:
      context: ../../services/billing
      dockerfile: Dockerfile
    command:
    - python
    - manage.py
    - run_billing_worker
    env_file:
    - ../../env/hung.env
    depends_on:
      billing:
        condition: service_healthy
    networks:
    - private
    restart: unless-stopped
    environment:
      PORT: ${BILLING_PORT:?set BILLING_PORT}
      JWT_PUBLIC_KEY_PATH: /run/config/jwt_public.pem
      RABBITMQ_HOST: ${RABBITMQ_HOST:?set online RabbitMQ host from Quân}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?set online RabbitMQ TLS port from Quân}
      RABBITMQ_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:?set online RabbitMQ vhost from Quân}
      UMC_AMQP_URL: ${UMC_AMQP_URL:?set shared AMQP URL from Quân}
    volumes:
    - ../../infra/certs/jwt_public.pem:/run/config/jwt_public.pem:ro
    init: true
    stop_grace_period: 20s
  notification:
    build:
      context: ../../services/notification
      dockerfile: Dockerfile
    env_file:
    - ../../env/hung.env
    networks:
    - private
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8006/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    environment:
      PORT: ${NOTIFICATION_PORT:?set NOTIFICATION_PORT}
      JWT_PUBLIC_KEY_PATH: /run/config/jwt_public.pem
      RABBITMQ_HOST: ${RABBITMQ_HOST:?set online RabbitMQ host from Quân}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?set online RabbitMQ TLS port from Quân}
      RABBITMQ_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:?set online RabbitMQ vhost from Quân}
      UMC_AMQP_URL: ${UMC_AMQP_URL:?set shared AMQP URL from Quân}
    volumes:
    - ../../infra/certs/jwt_public.pem:/run/config/jwt_public.pem:ro
    init: true
    stop_grace_period: 20s
  notification-worker:
    build:
      context: ../../services/notification
      dockerfile: Dockerfile
    command:
    - python
    - manage.py
    - run_notification_worker
    env_file:
    - ../../env/hung.env
    restart: unless-stopped
    depends_on:
      notification:
        condition: service_healthy
    networks:
    - private
    environment:
      PORT: ${NOTIFICATION_PORT:?set NOTIFICATION_PORT}
      JWT_PUBLIC_KEY_PATH: /run/config/jwt_public.pem
      RABBITMQ_HOST: ${RABBITMQ_HOST:?set online RabbitMQ host from Quân}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?set online RabbitMQ TLS port from Quân}
      RABBITMQ_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:?set online RabbitMQ vhost from Quân}
      UMC_AMQP_URL: ${UMC_AMQP_URL:?set shared AMQP URL from Quân}
    volumes:
    - ../../infra/certs/jwt_public.pem:/run/config/jwt_public.pem:ro
    init: true
    stop_grace_period: 20s
  gateway:
    build:
      context: ../../envoy
      dockerfile: Dockerfile
    ports:
    - 127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080
    volumes:
    - ../../.runtime/jwks.json:/etc/envoy/jwks.json:ro
    depends_on:
      patient:
        condition: service_healthy
      appointment:
        condition: service_healthy
      pharmacy:
        condition: service_healthy
      identity:
        condition: service_healthy
      billing:
        condition: service_healthy
      notification:
        condition: service_healthy
      catalog:
        condition: service_healthy
      clinical:
        condition: service_healthy
      diagnostic:
        condition: service_healthy
    networks:
    - private
    - default
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
  pharmacy-worker:
    build:
      context: ../../services/pharmacy
      dockerfile: Dockerfile
      additional_contexts:
        mongo_shared: ../../mongo
    command:
    - npm
    - run
    - worker
    environment:
      MONGODB_URI: $PHARMACY_MONGO_URI
      AMQP_URL: ${UMC_AMQP_URL:?set shared online AMQP URL from Quân}
    depends_on:
      pharmacy:
        condition: service_healthy
    networks:
    - private
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
  catalog:
    image: umc-care-catalog:local
    build: ../../services/catalog
    environment:
      DATABASE_URL: ${CATALOG_DATABASE_URL:?set Catalog PostgreSQL URL}
      LISTEN_ADDR: :${CATALOG_PORT:?set CATALOG_PORT}
      REDIS_URL: ${UMC_REDIS_URL:?set shared online Redis URL from Quân}
      JWT_ISSUER: umc-care-identity
      JWT_AUDIENCE: umc-care-services
      JWT_PUBLIC_KEY_FILE: /run/config/jwt_public.pem
      MIGRATE_ON_START: '1'
    volumes:
    - ../../infra/certs/jwt_public.pem:/run/config/jwt_public.pem:ro
    networks:
    - private
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /api
      - healthcheck
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    init: true
    stop_grace_period: 20s
  catalog-worker:
    image: umc-care-catalog:local
    entrypoint:
    - /worker
    environment:
      DATABASE_URL: ${CATALOG_DATABASE_URL:?set Catalog PostgreSQL URL}
      AMQP_URL: ${UMC_AMQP_URL:?set shared AMQP URL from Quân}
      CATALOG_DECLARE_TOPOLOGY: 'true'
    depends_on:
      catalog:
        condition: service_healthy
    networks:
    - private
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
  clinical:
    image: umc-care-clinical:local
    build: ../../services/clinical
    environment:
      DATABASE_URL: ${CLINICAL_DATABASE_URL:?set Clinical PostgreSQL URL}
      LISTEN_ADDR: :${CLINICAL_PORT:?set CLINICAL_PORT}
      JWT_ISSUER: umc-care-identity
      JWT_AUDIENCE: umc-care-services
      JWT_PUBLIC_KEY_FILE: /run/config/jwt_public.pem
      MIGRATE_ON_START: '1'
      REDIS_URL: ${UMC_REDIS_URL:?set shared online Redis URL from Quân}
    volumes:
    - ../../infra/certs/jwt_public.pem:/run/config/jwt_public.pem:ro
    networks:
    - private
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /api
      - healthcheck
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    init: true
    stop_grace_period: 20s
  clinical-worker:
    image: umc-care-clinical:local
    entrypoint:
    - /worker
    environment:
      DATABASE_URL: ${CLINICAL_DATABASE_URL:?set Clinical PostgreSQL URL}
      RABBITMQ_URL: ${UMC_AMQP_URL:?set shared AMQP URL from Quân}
      CLINICAL_DECLARE_TOPOLOGY: '1'
    depends_on:
      clinical:
        condition: service_healthy
    networks:
    - private
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
  diagnostic:
    image: umc-care-diagnostic:local
    build: ../../services/diagnostic
    environment:
      DATABASE_URL: ${DIAGNOSTIC_DATABASE_URL:?set Diagnostic PostgreSQL URL}
      LISTEN_ADDR: :${DIAGNOSTIC_PORT:?set DIAGNOSTIC_PORT}
      JWT_ISSUER: umc-care-identity
      JWT_AUDIENCE: umc-care-services
      JWT_PUBLIC_KEY_FILE: /run/config/jwt_public.pem
      MIGRATE_ON_START: '1'
      REDIS_URL: ${UMC_REDIS_URL:?set shared online Redis URL from Quân}
    volumes:
    - ../../infra/certs/jwt_public.pem:/run/config/jwt_public.pem:ro
    networks:
    - private
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /api
      - healthcheck
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    init: true
    stop_grace_period: 20s
  diagnostic-worker:
    image: umc-care-diagnostic:local
    entrypoint:
    - /worker
    environment:
      DATABASE_URL: ${DIAGNOSTIC_DATABASE_URL:?set Diagnostic PostgreSQL URL}
      RABBITMQ_URL: ${UMC_AMQP_URL:?set shared AMQP URL from Quân}
      DIAGNOSTIC_DECLARE_TOPOLOGY: '1'
    depends_on:
      diagnostic:
        condition: service_healthy
    networks:
    - private
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
  identity-worker:
    build: *id001
    env_file:
    - ../../env/hung.env
    command:
    - python
    - manage.py
    - run_identity_worker
    environment: *id002
    volumes: *id003
    depends_on:
      identity:
        condition: service_healthy
    networks:
    - private
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
  web:
    build: ../../apps/web
    image: hqh-care-web:local
    ports:
    - 127.0.0.1:15173:8080
    depends_on:
      gateway:
        condition: service_healthy
    networks:
    - private
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
networks:
  private:
    internal: false
  default: {}
