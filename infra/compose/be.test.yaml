name: umc-be-test
services:
  mongo:
    image: mongo:8.0.16
    command:
    - cp /run/secrets/mongo-keyfile /tmp/umc-mongo.key && chmod 400 /tmp/umc-mongo.key
      && chown mongodb:mongodb /tmp/umc-mongo.key && exec docker-entrypoint.sh mongod
      --replSet rs0 --bind_ip_all --keyFile /tmp/umc-mongo.key
    environment:
      MONGO_INITDB_ROOT_USERNAME: $MONGO_ROOT_USER
      MONGO_INITDB_ROOT_PASSWORD: $MONGO_ROOT_PASSWORD
    secrets:
    - source: mongo-keyfile
      target: mongo-keyfile
      mode: 256
    volumes:
    - mongo_data:/data/db
    networks:
    - private
    healthcheck:
      test:
      - CMD-SHELL
      - mongosh --quiet --host localhost --username "$$MONGO_INITDB_ROOT_USERNAME"
        --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval
        "db.adminCommand({ping:1}).ok"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    entrypoint:
    - bash
    - -ec
  mongo-bootstrap:
    image: mongo:8.0.16
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_ROOT_USER: $MONGO_ROOT_USER
      MONGO_ROOT_PASSWORD: $MONGO_ROOT_PASSWORD
      PATIENT_DB_PASSWORD: $PATIENT_DB_PASSWORD
      APPOINTMENT_DB_PASSWORD: $APPOINTMENT_DB_PASSWORD
      PHARMACY_DB_PASSWORD: $PHARMACY_DB_PASSWORD
    volumes:
    - ../../mongo/init-replica.js:/bootstrap/init-replica.js:ro
    - ../../mongo/init-users.js:/bootstrap/init-users.js:ro
    networks:
    - private
    entrypoint:
    - sh
    - -ec
    command:
    - 'uri="mongodb://$$MONGO_ROOT_USER:$$MONGO_ROOT_PASSWORD@mongo:27017/admin?authSource=admin"

      mongosh "$$uri" --quiet --eval "load(''/bootstrap/init-replica.js''); initializeReplica()"

      mongosh "$$uri" --quiet --eval "load(''/bootstrap/init-users.js''); createOwnerUsers({patient:''$$PATIENT_DB_PASSWORD'',appointment:''$$APPOINTMENT_DB_PASSWORD'',pharmacy:''$$PHARMACY_DB_PASSWORD''})"

      '
  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: rabbitmq
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    networks:
    - private
    - default
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /umc-be-test
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: umc_bootstrap
      POSTGRES_DB: umc_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set owner database password}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?set owner database password}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set owner database password}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set owner database password}
      CLINICAL_DB_PASSWORD: ${CLINICAL_DB_PASSWORD:?set owner database password}
      DIAGNOSTIC_DB_PASSWORD: ${DIAGNOSTIC_DB_PASSWORD:?set owner database password}
    volumes:
    - postgres_be_data:/var/lib/postgresql
    - ./postgres/all/init.sh:/docker-entrypoint-initdb.d/10-owners.sh:ro
    networks:
    - private
    - default
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U umc_bootstrap -d umc_bootstrap
      interval: 5s
      timeout: 3s
      retries: 20
  patient:
    build:
      context: ../..
      dockerfile: services/patient/Dockerfile
    environment:
      NODE_ENV: production
      PORT: ${PATIENT_PORT:?set PATIENT_PORT}
      MONGODB_URI: $PATIENT_MONGO_URI
      JWT_PUBLIC_KEY_FILE: /run/config/jwt_public.pem
      JWT_ISSUER: umc-care-identity
      JWT_AUDIENCE: umc-care-services
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: patient
      RABBITMQ_PASSWORD: ${PATIENT_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      AMQP_URL: ${PATIENT_AMQP_URL}
      RABBITMQ_URL: ${PATIENT_AMQP_URL}
      UMC_AMQP_URL: ${PATIENT_AMQP_URL}
    volumes:
    - ../../.runtime/be-test/jwt_public.pem:/run/config/jwt_public.pem:ro
    depends_on:
      mongo-bootstrap:
        condition: service_completed_successfully
    networks:
    - private
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:' + process.env.PORT + '/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
  appointment:
    build:
      context: ../..
      dockerfile: services/appointment/Dockerfile
    environment:
      NODE_ENV: production
      PORT: ${APPOINTMENT_PORT:?set APPOINTMENT_PORT}
      MONGODB_URI: $APPOINTMENT_MONGO_URI
      JWT_PUBLIC_KEY_FILE: /run/config/jwt_public.pem
      JWT_ISSUER: umc-care-identity
      JWT_AUDIENCE: umc-care-services
      APPOINTMENT_REDIS_URL: redis://appointment:${APPOINTMENT_REDIS_PASSWORD}@redis-catalog:6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: appointment
      RABBITMQ_PASSWORD: ${APPOINTMENT_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      AMQP_URL: ${APPOINTMENT_AMQP_URL}
      RABBITMQ_URL: ${APPOINTMENT_AMQP_URL}
      UMC_AMQP_URL: ${APPOINTMENT_AMQP_URL}
    volumes:
    - ../../.runtime/be-test/jwt_public.pem:/run/config/jwt_public.pem:ro
    depends_on:
      mongo-bootstrap:
        condition: service_completed_successfully
    networks:
    - private
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:' + process.env.PORT + '/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
  appointment-worker:
    build:
      context: ../..
      dockerfile: services/appointment/Dockerfile
    command:
    - npm
    - run
    - worker
    environment:
      NODE_ENV: production
      MONGODB_URI: $APPOINTMENT_MONGO_URI
      AMQP_URL: ${APPOINTMENT_AMQP_URL}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: appointment
      RABBITMQ_PASSWORD: ${APPOINTMENT_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      RABBITMQ_URL: ${APPOINTMENT_AMQP_URL}
      UMC_AMQP_URL: ${APPOINTMENT_AMQP_URL}
    depends_on:
      mongo-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
    - private
  patient-worker:
    build:
      context: ../..
      dockerfile: services/patient/Dockerfile
    command:
    - npm
    - run
    - worker
    environment:
      NODE_ENV: production
      MONGODB_URI: $PATIENT_MONGO_URI
      AMQP_URL: ${PATIENT_AMQP_URL}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: patient
      RABBITMQ_PASSWORD: ${PATIENT_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      RABBITMQ_URL: ${PATIENT_AMQP_URL}
      UMC_AMQP_URL: ${PATIENT_AMQP_URL}
    depends_on:
      mongo-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
    - private
  pharmacy:
    build:
      context: ../..
      dockerfile: services/pharmacy/Dockerfile
    environment:
      NODE_ENV: production
      PORT: ${PHARMACY_PORT:?set PHARMACY_PORT}
      MONGODB_URI: $PHARMACY_MONGO_URI
      JWT_PUBLIC_KEY_FILE: /run/config/jwt_public.pem
      JWT_ISSUER: umc-care-identity
      JWT_AUDIENCE: umc-care-services
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: pharmacy
      RABBITMQ_PASSWORD: ${PHARMACY_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      AMQP_URL: ${PHARMACY_AMQP_URL}
      RABBITMQ_URL: ${PHARMACY_AMQP_URL}
      UMC_AMQP_URL: ${PHARMACY_AMQP_URL}
    volumes:
    - ../../.runtime/be-test/jwt_public.pem:/run/config/jwt_public.pem:ro
    depends_on:
      mongo-bootstrap:
        condition: service_completed_successfully
    networks:
    - private
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:' + process.env.PORT + '/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
  identity:
    build:
      context: ../../services/identity
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - private
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8004/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      PORT: ${IDENTITY_PORT:?set IDENTITY_PORT}
      JWT_PUBLIC_KEY_PATH: /run/config/jwt_public.pem
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: identity
      RABBITMQ_PASSWORD: ${IDENTITY_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      UMC_AMQP_URL: ${IDENTITY_AMQP_URL}
      JWT_PRIVATE_KEY_PATH: /run/secrets/identity_private.pem
      AMQP_URL: ${IDENTITY_AMQP_URL}
      RABBITMQ_URL: ${IDENTITY_AMQP_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set test secret}
      DEBUG: 'false'
      ALLOW_DEV_OTP: 'false'
      IDENTITY_DB_HOST: postgres
      IDENTITY_DB_PORT: '5432'
      IDENTITY_DB_NAME: identity_db
      IDENTITY_DB_USER: identity_owner
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      IDENTITY_DB_SSLMODE: disable
    volumes: &id001
    - ../../.runtime/be-test/jwt_public.pem:/run/config/jwt_public.pem:ro
    - ../../.runtime/be-test/jwt_private.pem:/run/secrets/identity_private.pem:ro
  billing:
    build:
      context: ../../services/billing
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - private
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8005/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      PORT: ${BILLING_PORT:?set BILLING_PORT}
      JWT_PUBLIC_KEY_PATH: /run/config/jwt_public.pem
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: billing
      RABBITMQ_PASSWORD: ${BILLING_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      UMC_AMQP_URL: ${BILLING_AMQP_URL}
      AMQP_URL: ${BILLING_AMQP_URL}
      RABBITMQ_URL: ${BILLING_AMQP_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set test secret}
      DEBUG: 'false'
      ALLOW_DEV_OTP: 'false'
      BILLING_DB_HOST: postgres
      BILLING_DB_PORT: '5432'
      BILLING_DB_NAME: billing_db
      BILLING_DB_USER: billing_owner
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD}
      BILLING_DB_SSLMODE: disable
    volumes:
    - ../../.runtime/be-test/jwt_public.pem:/run/config/jwt_public.pem:ro
  billing-worker:
    build:
      context: ../../services/billing
      dockerfile: Dockerfile
    command:
    - python
    - manage.py
    - run_billing_worker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      billing:
        condition: service_healthy
    networks:
    - private
    environment:
      PORT: ${BILLING_PORT:?set BILLING_PORT}
      JWT_PUBLIC_KEY_PATH: /run/config/jwt_public.pem
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: billing
      RABBITMQ_PASSWORD: ${BILLING_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      UMC_AMQP_URL: ${BILLING_AMQP_URL}
      AMQP_URL: ${BILLING_AMQP_URL}
      RABBITMQ_URL: ${BILLING_AMQP_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set test secret}
      DEBUG: 'false'
      ALLOW_DEV_OTP: 'false'
      BILLING_DB_HOST: postgres
      BILLING_DB_PORT: '5432'
      BILLING_DB_NAME: billing_db
      BILLING_DB_USER: billing_owner
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD}
      BILLING_DB_SSLMODE: disable
    volumes:
    - ../../.runtime/be-test/jwt_public.pem:/run/config/jwt_public.pem:ro
  notification:
    build:
      context: ../../services/notification
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - private
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8006/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      PORT: ${NOTIFICATION_PORT:?set NOTIFICATION_PORT}
      JWT_PUBLIC_KEY_PATH: /run/config/jwt_public.pem
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: notification
      RABBITMQ_PASSWORD: ${NOTIFICATION_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      UMC_AMQP_URL: ${NOTIFICATION_AMQP_URL}
      AMQP_URL: ${NOTIFICATION_AMQP_URL}
      RABBITMQ_URL: ${NOTIFICATION_AMQP_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set test secret}
      DEBUG: 'false'
      ALLOW_DEV_OTP: 'false'
      NOTIFICATION_DB_HOST: postgres
      NOTIFICATION_DB_PORT: '5432'
      NOTIFICATION_DB_NAME: notification_db
      NOTIFICATION_DB_USER: notification_owner
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      NOTIFICATION_DB_SSLMODE: disable
    volumes:
    - ../../.runtime/be-test/jwt_public.pem:/run/config/jwt_public.pem:ro
  notification-worker:
    build:
      context: ../../services/notification
      dockerfile: Dockerfile
    command:
    - python
    - manage.py
    - run_notification_worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      notification:
        condition: service_healthy
    networks:
    - private
    environment:
      PORT: ${NOTIFICATION_PORT:?set NOTIFICATION_PORT}
      JWT_PUBLIC_KEY_PATH: /run/config/jwt_public.pem
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: notification
      RABBITMQ_PASSWORD: ${NOTIFICATION_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      UMC_AMQP_URL: ${NOTIFICATION_AMQP_URL}
      AMQP_URL: ${NOTIFICATION_AMQP_URL}
      RABBITMQ_URL: ${NOTIFICATION_AMQP_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set test secret}
      DEBUG: 'false'
      ALLOW_DEV_OTP: 'false'
      NOTIFICATION_DB_HOST: postgres
      NOTIFICATION_DB_PORT: '5432'
      NOTIFICATION_DB_NAME: notification_db
      NOTIFICATION_DB_USER: notification_owner
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      NOTIFICATION_DB_SSLMODE: disable
    volumes:
    - ../../.runtime/be-test/jwt_public.pem:/run/config/jwt_public.pem:ro
  gateway:
    build:
      context: ../../envoy
      dockerfile: Dockerfile
    ports:
    - 127.0.0.1:18080:8080
    volumes:
    - ../../.runtime/be-test/jwks.json:/etc/envoy/jwks.json:ro
    depends_on:
      identity:
        condition: service_healthy
      billing:
        condition: service_healthy
      notification:
        condition: service_healthy
    networks:
    - private
    - default
  pharmacy-worker:
    build:
      context: ../..
      dockerfile: services/pharmacy/Dockerfile
    command:
    - npm
    - run
    - worker
    environment:
      MONGODB_URI: $PHARMACY_MONGO_URI
      AMQP_URL: ${PHARMACY_AMQP_URL}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: pharmacy
      RABBITMQ_PASSWORD: ${PHARMACY_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      RABBITMQ_URL: ${PHARMACY_AMQP_URL}
      UMC_AMQP_URL: ${PHARMACY_AMQP_URL}
    depends_on:
      mongo-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
    - private
  redis-catalog:
    image: redis:7.4-alpine
    environment:
      CATALOG_REDIS_PASSWORD: ${CATALOG_REDIS_PASSWORD:?set CATALOG_REDIS_PASSWORD}
      APPOINTMENT_REDIS_PASSWORD: ${APPOINTMENT_REDIS_PASSWORD:?set APPOINTMENT_REDIS_PASSWORD}
    entrypoint:
    - /bin/sh
    - -c
    command:
    - printf 'user default off\nuser catalog on >%s ~umc:catalog:v1:* +hello +auth
      +ping +get +set +setnx\nuser appointment on >%s ~umc:appointment:available:v1:*
      +hello +auth +ping +get +set +del +scan\n' "$${CATALOG_REDIS_PASSWORD}" "$${APPOINTMENT_REDIS_PASSWORD}"
      > /tmp/cache-users.acl && exec redis-server --aclfile /tmp/cache-users.acl --maxmemory
      128mb --maxmemory-policy allkeys-lru
    networks:
    - private
  catalog-migrate:
    build: ../../services/catalog
    image: umc-care-catalog:local
    entrypoint:
    - /migrate
    environment:
      DATABASE_URL: ${CATALOG_DATABASE_URL:?set Catalog PostgreSQL URL}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: catalog
      RABBITMQ_PASSWORD: ${CATALOG_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      AMQP_URL: ${CATALOG_AMQP_URL}
      RABBITMQ_URL: ${CATALOG_AMQP_URL}
      UMC_AMQP_URL: ${CATALOG_AMQP_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - private
  catalog:
    image: umc-care-catalog:local
    build: ../../services/catalog
    environment:
      DATABASE_URL: ${CATALOG_DATABASE_URL:?set Catalog PostgreSQL URL}
      LISTEN_ADDR: :${CATALOG_PORT:?set CATALOG_PORT}
      REDIS_ADDR: redis-catalog:6379
      REDIS_USERNAME: catalog
      REDIS_PASSWORD: ${CATALOG_REDIS_PASSWORD}
      JWT_ISSUER: umc-care-identity
      JWT_AUDIENCE: umc-care-services
      JWT_PUBLIC_KEY_FILE: /run/config/jwt_public.pem
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: catalog
      RABBITMQ_PASSWORD: ${CATALOG_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      AMQP_URL: ${CATALOG_AMQP_URL}
      RABBITMQ_URL: ${CATALOG_AMQP_URL}
      UMC_AMQP_URL: ${CATALOG_AMQP_URL}
    volumes:
    - ../../.runtime/be-test/jwt_public.pem:/run/config/jwt_public.pem:ro
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    networks:
    - private
  catalog-worker:
    image: umc-care-catalog:local
    entrypoint:
    - /worker
    environment:
      DATABASE_URL: ${CATALOG_DATABASE_URL:?set Catalog PostgreSQL URL}
      AMQP_URL: ${CATALOG_AMQP_URL}
      CATALOG_DECLARE_TOPOLOGY: 'true'
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: catalog
      RABBITMQ_PASSWORD: ${CATALOG_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      RABBITMQ_URL: ${CATALOG_AMQP_URL}
      UMC_AMQP_URL: ${CATALOG_AMQP_URL}
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
    - private
  clinical-migrate:
    build: ../../services/clinical
    image: umc-care-clinical:local
    entrypoint:
    - /migrate
    environment:
      DATABASE_URL: ${CLINICAL_DATABASE_URL:?set Clinical PostgreSQL URL}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: clinical
      RABBITMQ_PASSWORD: ${CLINICAL_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      AMQP_URL: ${CLINICAL_AMQP_URL}
      RABBITMQ_URL: ${CLINICAL_AMQP_URL}
      UMC_AMQP_URL: ${CLINICAL_AMQP_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - private
  clinical:
    image: umc-care-clinical:local
    build: ../../services/clinical
    environment:
      DATABASE_URL: ${CLINICAL_DATABASE_URL:?set Clinical PostgreSQL URL}
      LISTEN_ADDR: :${CLINICAL_PORT:?set CLINICAL_PORT}
      JWT_ISSUER: umc-care-identity
      JWT_AUDIENCE: umc-care-services
      JWT_PUBLIC_KEY_FILE: /run/config/jwt_public.pem
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: clinical
      RABBITMQ_PASSWORD: ${CLINICAL_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      AMQP_URL: ${CLINICAL_AMQP_URL}
      RABBITMQ_URL: ${CLINICAL_AMQP_URL}
      UMC_AMQP_URL: ${CLINICAL_AMQP_URL}
    volumes:
    - ../../.runtime/be-test/jwt_public.pem:/run/config/jwt_public.pem:ro
    depends_on:
      clinical-migrate:
        condition: service_completed_successfully
    networks:
    - private
  clinical-worker:
    image: umc-care-clinical:local
    entrypoint:
    - /worker
    environment:
      DATABASE_URL: ${CLINICAL_DATABASE_URL:?set Clinical PostgreSQL URL}
      RABBITMQ_URL: ${CLINICAL_AMQP_URL}
      CLINICAL_DECLARE_TOPOLOGY: '1'
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: clinical
      RABBITMQ_PASSWORD: ${CLINICAL_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      AMQP_URL: ${CLINICAL_AMQP_URL}
      UMC_AMQP_URL: ${CLINICAL_AMQP_URL}
    depends_on:
      clinical-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
    - private
  diagnostic-migrate:
    build: ../../services/diagnostic
    image: umc-care-diagnostic:local
    entrypoint:
    - /migrate
    environment:
      DATABASE_URL: ${DIAGNOSTIC_DATABASE_URL:?set Diagnostic PostgreSQL URL}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: diagnostic
      RABBITMQ_PASSWORD: ${DIAGNOSTIC_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      AMQP_URL: ${DIAGNOSTIC_AMQP_URL}
      RABBITMQ_URL: ${DIAGNOSTIC_AMQP_URL}
      UMC_AMQP_URL: ${DIAGNOSTIC_AMQP_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - private
  diagnostic:
    image: umc-care-diagnostic:local
    build: ../../services/diagnostic
    environment:
      DATABASE_URL: ${DIAGNOSTIC_DATABASE_URL:?set Diagnostic PostgreSQL URL}
      LISTEN_ADDR: :${DIAGNOSTIC_PORT:?set DIAGNOSTIC_PORT}
      JWT_ISSUER: umc-care-identity
      JWT_AUDIENCE: umc-care-services
      JWT_PUBLIC_KEY_FILE: /run/config/jwt_public.pem
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: diagnostic
      RABBITMQ_PASSWORD: ${DIAGNOSTIC_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      AMQP_URL: ${DIAGNOSTIC_AMQP_URL}
      RABBITMQ_URL: ${DIAGNOSTIC_AMQP_URL}
      UMC_AMQP_URL: ${DIAGNOSTIC_AMQP_URL}
    volumes:
    - ../../.runtime/be-test/jwt_public.pem:/run/config/jwt_public.pem:ro
    depends_on:
      diagnostic-migrate:
        condition: service_completed_successfully
    networks:
    - private
  diagnostic-worker:
    image: umc-care-diagnostic:local
    entrypoint:
    - /worker
    environment:
      DATABASE_URL: ${DIAGNOSTIC_DATABASE_URL:?set Diagnostic PostgreSQL URL}
      RABBITMQ_URL: ${DIAGNOSTIC_AMQP_URL}
      DIAGNOSTIC_DECLARE_TOPOLOGY: '1'
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: diagnostic
      RABBITMQ_PASSWORD: ${DIAGNOSTIC_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      AMQP_URL: ${DIAGNOSTIC_AMQP_URL}
      UMC_AMQP_URL: ${DIAGNOSTIC_AMQP_URL}
    depends_on:
      diagnostic-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
    - private
  identity-worker:
    build:
      context: ../../services/identity
      dockerfile: Dockerfile
    command:
    - python
    - manage.py
    - run_identity_worker
    environment:
      PORT: ${IDENTITY_PORT:?set IDENTITY_PORT}
      JWT_PUBLIC_KEY_PATH: /run/config/jwt_public.pem
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: identity
      RABBITMQ_PASSWORD: ${IDENTITY_RABBIT_PASSWORD}
      RABBITMQ_VHOST: /umc-be-test
      UMC_AMQP_URL: ${IDENTITY_AMQP_URL}
      JWT_PRIVATE_KEY_PATH: /run/secrets/identity_private.pem
      AMQP_URL: ${IDENTITY_AMQP_URL}
      RABBITMQ_URL: ${IDENTITY_AMQP_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set test secret}
      DEBUG: 'false'
      ALLOW_DEV_OTP: 'false'
      IDENTITY_DB_HOST: postgres
      IDENTITY_DB_PORT: '5432'
      IDENTITY_DB_NAME: identity_db
      IDENTITY_DB_USER: identity_owner
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      IDENTITY_DB_SSLMODE: disable
    volumes: *id001
    depends_on:
      identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
    - private
networks:
  private:
    internal: false
volumes:
  mongo_data: null
  rabbitmq_data: null
  postgres_data: null
  huy_postgres_data: null
  postgres_be_data: null
secrets:
  mongo-keyfile:
    file: ../../.runtime/be-test/mongo.key
